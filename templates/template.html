<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{TITLE}}</title>
    
    <!-- KaTeX CSS e JS locais com fallback CDN -->
    <link rel="stylesheet" href="assets/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="assets/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="assets/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid JS local com fallback CDN -->
    <script src="assets/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

    <style>
{{CSS}}
    </style>
</head>
<body>

    <!-- CAPA OFICIAL (SE HOUVER) -->
{{COVER}}

    <!-- SUMÁRIO EXECUTIVO AUTOMÁTICO -->
{{TOC}}

    <!-- CONTEÚDO PRINCIPAL COMPILADO -->
    <main class="content-body">
{{CONTENT}}
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", async function() {
        // 1. Renderizar fórmulas KaTeX
        try {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "\\[", right: "\\]", display: true},
                        {left: "$", right: "$", display: false}
                    ],
                    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
                    throwOnError: false
                });
                console.log("[KaTeX] Renderizado com sucesso!");
            }
        } catch(e) {
            console.warn("[KaTeX] Erro:", e);
        }
        window.katexDone = true;

        // 2. Renderizar diagramas Mermaid com dimensionamento dinâmico e inteligente via viewBox
        try {
            if (window.mermaid) {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'default',
                    securityLevel: 'loose',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
                    themeVariables: { fontSize: '15px' },
                    flowchart: {
                        htmlLabels: true,
                        useMaxWidth: false,
                        wrappingWidth: 200,
                        nodeSpacing: 35,
                        rankSpacing: 45
                    }
                });

                const mermaidElements = document.querySelectorAll('.mermaid');
                for (let i = 0; i < mermaidElements.length; i++) {
                    try {
                        await mermaid.run({ nodes: [mermaidElements[i]] });
                    } catch(err) {
                        console.warn("[Mermaid] Erro diagrama " + i + ":", err);
                    }
                }

                // Pós-processamento dinâmico de todos os SVGs do Mermaid com base na razão w / h do viewBox
                const svgs = document.querySelectorAll('.mermaid svg, pre.mermaid svg, .mermaid-container svg, .mermaid-svg-wrapper svg');
                for (const svg of svgs) {
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                    svg.style.removeProperty('height');
                    svg.style.removeProperty('max-height');

                    let w = 0, h = 0;
                    const vbAttr = svg.getAttribute('viewBox');
                    if (vbAttr) {
                        const parts = vbAttr.trim().split(/[\s,]+/).map(Number);
                        if (parts.length === 4) {
                            w = parts[2];
                            h = parts[3];
                        }
                    } else if (svg.viewBox && svg.viewBox.baseVal) {
                        w = svg.viewBox.baseVal.width;
                        h = svg.viewBox.baseVal.height;
                    }

                    if (w > 0 && h > 0) {
                        const ratio = w / h;
                        if (ratio > 2.5) {
                            svg.style.width = '100%';
                            svg.style.maxWidth = '920px';
                            svg.style.height = 'auto';
                            svg.style.minHeight = '180px';
                        } else {
                            svg.style.width = '100%';
                            svg.style.maxWidth = '760px';
                            svg.style.height = 'auto';
                            svg.style.minHeight = '240px';
                        }
                        svg.style.display = 'block';
                        svg.style.margin = '0 auto';
                    }
                }
                console.log("[Mermaid] Renderizado e redimensionado com sucesso!");
            }
        } catch(e) {
            console.warn("[Mermaid] Erro global:", e);
        }
        window.mermaidDone = true;

        document.body.setAttribute('data-ready', 'true');
    });
    </script>
</body>
</html>
